---
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: assessment
servers: 1
agents: 0
ports:
- port: 80:80
  nodeFilters:
  - loadbalancer
- port: 443:443
  nodeFilters:
  - loadbalancer
image: docker.io/rancher/k3s:v1.35.5-k3s1
files:
- description: 'Auto-create custom namespace on startup'
  source: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: argocd
  destination: k3s-manifests-custom/namespaces.yaml

registries:
  config: |
    "localhost:31000":
        endpoint:
          - "localhost:31000"
        tls:
          insecure_skip_verify: true
